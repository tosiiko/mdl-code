<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MDL Login</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
<main class="mdl-page" id="forgotPage">
  <div class="mdl-hero">
    <h2>Reset password</h2>
    <p>Test a popup message without leaving the local MDL preview.</p>
  </div>
  <form class="mdl-form" id="resetForm" data-mdl-on-submit="handleResetPassword">
    <div class="mdl-field" id="resetEmailField">
      <label class="mdl-label">
        <p>Email address</p>
      </label>
      <input class="mdl-input" type="email" id="resetEmailInput" required placeholder="demo@mdl.local">
    </div>
    <div class="mdl-error" id="resetMsg" aria-live="polite">
      <p>Enter an email and MDL will show a reset confirmation popup.</p>
    </div>
    <div class="mdl-actions">
      <button class="mdl-btn-primary" id="resetBtn">Send reset link</button>
      <button class="mdl-btn-ghost" type="button" data-mdl-on-click="goToLogin">Back to sign in</button>
    </div>
  </form>
  <div class="mdl-popup" id="appPopup" aria-live="polite">
    <div class="mdl-panel">
      <div class="mdl-popup-title" id="popupTitle">
        <p>Message</p>
      </div>
      <div class="mdl-popup-message" id="popupMessage">
        <p>Waiting.</p>
      </div>
      <div class="mdl-actions">
        <button class="mdl-btn-secondary" type="button" id="popupCloseBtn" data-mdl-on-click="closePopup">OK</button>
      </div>
    </div>
  </div>
</main>
<script type="module">
import * as mdlModule0 from "./scripts/auth.js";
const mdlHandlers = Object.assign({}, globalThis, mdlModule0);
const mdlBind = (eventName) => {
  document.querySelectorAll(`[data-mdl-on-${eventName}]`).forEach((element) => {
    const handlerName = element.getAttribute(`data-mdl-on-${eventName}`);
    const handler = mdlHandlers[handlerName];
    if (typeof handler === "function") {
      element.addEventListener(eventName, (event) => handler(event));
    }
  });
};
["click", "submit", "input", "change"].forEach(mdlBind);
</script>
</body>
</html>
